[package]
name = "clip-mash-server"
version = "0.23.1"
edition = "2024"
default-run = "clip-mash-server"
license = "GPL-3.0"

[lib]
name = "clip_mash_server"
crate-type = ["rlib"]

[dependencies]
clip-mash = { path = "../clip-mash" }

async-stream = "0.3.6"
axum = { version = "0.8", features = ["macros", "multipart"] }
camino = { version = "1.2.6", features = ["serde1"] }
color-eyre = "0.6.5"
futures = "0.3.34"
mimalloc = "0.1.52"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
sanitise-file-name = "1.0.0"
sentry = { version = "0.49", features = ["debug-images"] }
sentry-tower = { version = "0.49", features = ["axum-matched-path"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "trace", "cors"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum"] }

[target.'cfg(windows)'.dependencies]
# used for listing drives on windows
sysinfo = "0.39"
