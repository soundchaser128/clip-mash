[package]
name = "clip-mash-server"
version = "0.23.1"
edition = "2024"
default-run = "clip-mash-server"
license = "GPL-3.0"

[lib]
name = "clip_mash_server"
crate-type = ["rlib"]

[dependencies]
clip-mash = { path = "../clip-mash" }

async-stream = "0.3.6"
axum = { version = "0.8", features = ["macros", "multipart"] }
camino = { version = "1.2.2", features = ["serde1"] }
color-eyre = "0.6.5"
futures = "0.3.31"
mimalloc = "0.1.48"
rand = "0.9.2"
reqwest = { version = "0.13.1", default-features = false, features = ["json"] }
sanitise-file-name = "1.0.0"
sentry = { version = "0.46", features = ["debug-images"] }
sentry-tower = { version = "0.46", features = ["axum-matched-path"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
time = { version = "0.3.46", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
utoipa = { version = "5.4.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

[target.'cfg(windows)'.dependencies]
# used for listing drives on windows
sysinfo = "0.38"
